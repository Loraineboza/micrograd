[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraineboza-micrograd"
version = "0.1.0"
description = "A small NumPy automatic differentiation engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["micrograd"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_gradcheck"]
