
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd-numpy"
version = "0.1.0"
description = "A small NumPy-based automatic differentiation library"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
include = ["micrograd*"]
